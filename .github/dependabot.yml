version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      mcp-sdk:
        patterns: ["@modelcontextprotocol/*"]
      dev-tooling:
        dependency-type: development
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: weekly }
  # The Tailscale sidecar: tailscaled sets the identity headers, so its fixes matter.
  - package-ecosystem: docker
    directory: /deploy/tailscale
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }
  # The self-hosted Overpass image (deploy/overpass, docs/overpass.md).
  - package-ecosystem: docker-compose
    directory: /deploy/overpass
    schedule: { interval: weekly }
