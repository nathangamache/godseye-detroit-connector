; Replaces the image's supervisord config: no `user=` switching (the container already runs as
; uid 10003 with no capabilities), no replication or area-update loops (the database is rebuilt
; from a fresh extract instead), and nothing written outside /tmp and /db.
[supervisord]
; nodaemon already copies supervisord's own log to stdout.
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:dispatcher]
command=/app/bin/dispatcher_start.sh
priority=1
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:dispatcher_areas]
command=nice /app/bin/dispatcher_start.sh --areas
priority=2
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:fcgiwrap]
command=/app/bin/start_fcgiwarp.sh
priority=3
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -e stderr -c /overpass/nginx.conf
priority=4
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
