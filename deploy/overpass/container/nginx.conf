# Replaces the image's nginx config: runs unprivileged (uid 10003; Docker lets any uid bind
# port 80 inside the container's network namespace), writes only under /tmp, serves only the
# Overpass API endpoints the gateway and GEV use, and keeps no access log (query bodies carry the
# boxes and points being looked up).
daemon off;
worker_processes 2;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/nginx/client_body;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    proxy_temp_path /tmp/nginx/proxy;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    keepalive_timeout 60s;
    gzip on;
    gzip_proxied any;
    gzip_types application/json application/osm3s+xml text/csv text/plain;

    server {
        listen 80 default_server;
        server_name _;
        # Overpass QL queries are small (GEV caps its bodies at 24 KB).
        client_max_body_size 64k;

        location = /api/interpreter { rewrite ^/api/(.+)$ /cgi-bin/$1 last; }
        location = /api/status { rewrite ^/api/(.+)$ /cgi-bin/$1 last; }
        location = /api/timestamp { rewrite ^/api/(.+)$ /cgi-bin/$1 last; }
        location = /api/kill_my_queries { rewrite ^/api/(.+)$ /cgi-bin/$1 last; }

        location ~ ^/cgi-bin/(interpreter|status|timestamp|kill_my_queries)$ {
            internal;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app$fastcgi_script_name;
            fastcgi_pass unix:/nginx/fcgiwrap.socket;
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;
        }

        location / {
            return 404;
        }
    }
}
