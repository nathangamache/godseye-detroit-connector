# Optional override for local debugging only: publishes the gateway on 127.0.0.1:7700.
#   docker-compose -p godseye -f docker-compose.yml -f docker-compose.debug.yml up -d gev tailscale gateway
# Never publish on 0.0.0.0; the gateway already authenticates, but the tunnel is the only public path.
version: "2.4"
services:
  # The gateway shares the tailscale sidecar's network namespace, so ports are published there.
  # Only the PUBLIC listener (7700) can be published; the private one is loopback-only by design.
  tailscale:
    ports: ["127.0.0.1:7700:7700"]
